<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" class="anon-btn">
    <defs>
        <!-- Dark slate background for a modern editor feel -->
        <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1E293B" />
            <stop offset="100%" stop-color="#0F172A" />
        </linearGradient>

        <!-- Vibrant neon gradient for the masquerade mask -->
        <linearGradient id="mask-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#A78BFA" />
            <stop offset="100%" stop-color="#EC4899" />
        </linearGradient>

        <!-- Metallic gradient for the fountain pen nib -->
        <linearGradient id="nib-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#F8FAFC" />
            <stop offset="100%" stop-color="#94A3B8" />
        </linearGradient>

        <!-- Ambient glow to make the mask pop against the dark background -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#EC4899" flood-opacity="0.35" />
        </filter>

        <!-- Mask to punch out the pen nib's breather hole and slit -->
        <mask id="nib-cut">
            <rect width="120" height="120" fill="white" />
            <circle cx="60" cy="68" r="2.5" fill="black" />
            <line x1="60" y1="71" x2="60" y2="95" stroke="black" stroke-width="2" stroke-linecap="round" />
        </mask>
    </defs>

    <style>
        /* Button interaction states */
        .anon-btn {
        transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        cursor: pointer;
        }
        .anon-btn:hover {
        transform: scale(1.04) translateY(-2px);
        }

        /* Blinking typing cursor */
        .cursor {
        animation: blink 1s step-end infinite;
        }
        @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
        }
    </style>

    <!-- Base Button Shape (macOS Style Squircle) -->
    <rect width="120" height="120" rx="24" fill="url(#bg-grad)" />
    <rect x="1" y="1" width="118" height="118" rx="23" fill="none" stroke="#334155" stroke-width="1.5" />


    <!-- The Official Markdown Logo (Top Center Header) -->
    <g stroke="#A454DB" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <!-- M -->
        <path d="M 50 20 V 12 L 55 17 L 60 12 V 20" />
        <!-- Down Arrow -->
        <path d="M 66 12 V 20 M 63 17 L 66 20 L 69 17" />
    </g>

    <!-- Blinking Typing Cursor (Next to Markdown logo) -->
    <line class="cursor" x1="74" y1="12" x2="74" y2="20" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" />

    <!-- Skeleton Text Lines (Background document depth) -->
    <g fill="#334155" opacity="0.4">
        <rect x="16" y="38" width="25" height="4" rx="2" />
        <rect x="16" y="50" width="15" height="4" rx="2" />
        <rect x="16" y="62" width="20" height="4" rx="2" />

        <rect x="79" y="38" width="25" height="4" rx="2" />
        <rect x="89" y="50" width="15" height="4" rx="2" />
        <rect x="84" y="62" width="20" height="4" rx="2" />

        <rect x="25" y="78" width="70" height="4" rx="2" />
        <rect x="40" y="90" width="40" height="4" rx="2" />
    </g>

    <!-- Mask Strap (Subtle line attaching the mask to the edges) -->
    <line x1="0" y1="46" x2="25" y2="46" stroke="#1E293B" stroke-width="3" />
    <line x1="95" y1="46" x2="120" y2="46" stroke="#1E293B" stroke-width="3" />
    <line x1="0" y1="46" x2="25" y2="46" stroke="#334155" stroke-width="1" />
    <line x1="95" y1="46" x2="120" y2="46" stroke="#334155" stroke-width="1" />

    <!-- Fountain Pen Nib (Emerging from beneath the mask) -->
    <g mask="url(#nib-cut)">
        <path d="M 52 50 L 68 50 L 68 65 C 68 80, 60 98, 60 98 C 60 98, 52 80, 52 65 Z" fill="url(#nib-grad)" />
        <!-- Decorative etched arc on the nib -->
        <path d="M 54 60 Q 60 65 66 60" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- Masquerade Domino Mask (Foreground) -->
    <!-- fill-rule="evenodd" is used to elegantly punch the eye holes out of the main mask shape -->
    <path fill-rule="evenodd" d="
    M 20 50 
    C 30 35, 50 35, 60 50 
    C 70 35, 90 35, 100 50 
    C 95 65, 75 65, 60 55 
    C 45 65, 25 65, 20 50 
    Z 
    M 32 50 Q 42 44 52 50 Q 42 56 32 50 Z 
    M 68 50 Q 78 44 88 50 Q 78 56 68 50 Z
  " fill="url(#mask-grad)" filter="url(#glow)" />

</svg>
