<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" class="opine-btn">
    <defs>
        <!-- Vibrant gradient blending an authoritative blue with a creative purple -->
        <linearGradient id="opine-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3B92F6" />
            <stop offset="100%" stop-color="#8B5CF6" />
        </linearGradient>

        <!-- Soft drop shadow for a clickable, elevated UI button feel -->
        <filter id="opine-shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#7C3AED" flood-opacity="0.3" />
        </filter>

        <!-- Mask to perfectly cut out the pen nib breather hole and slit -->
        <mask id="nib-cutout">
            <rect x="0" y="0" width="120" height="120" fill="white" />
            <!-- Breather hole -->
            <circle cx="60" cy="88" r="2.5" fill="black" />
            <!-- Nib slit -->
            <line x1="60" y1="91.5" x2="60" y2="102" stroke="black" stroke-width="2" stroke-linecap="round"/>
        </mask>
    </defs>

    <style>
        /* Subtle hover scale for interactive button feel */
        .opine-btn {
        transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        cursor: pointer;
        }
        .opine-btn:hover {
        transform: scale(1.05) translateY(-2px);
        }

        /* Blinking cursor to emphasize the "form/typing" nature of the destination */
        .cursor {
        animation: blink 1s step-end infinite;
        }
        @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
        }
    </style>

    <!-- Main Speech Bubble / Pen Nib base shape -->
    <!-- The bottom curve (C) creates the concave shape of a fountain pen nib -->
    <path
            d="M 30 19 
       H 90 
       A 15 15 0 0 1 105 34 
       V 64 
       A 15 15 0 0 1 90 79 
       H 72 
       C 72 86, 67 94, 60 102 
       C 53 94, 48 86, 48 79 
       H 30 
       A 15 15 0 0 1 15 64 
       V 34 
       A 15 15 0 0 1 30 19 
       Z"
            fill="url(#opine-grad)"
            filter="url(#opine-shadow)"
            mask="url(#nib-cutout)"
    />

    <!-- Decorative curve at the base of the pen nib to add depth -->
    <path d="M 48 79 Q 60 83 72 79" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3" stroke-linecap="round" />


    <!-- The Official Markdown Logo (M and Down Arrow) -->
    <g fill="none" stroke="#eaf9eb" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <!-- Letter M -->
        <path d="M 31 54 V 39 L 44.5 50 L 58 39 V 54" />
        <!-- Down Arrow -->
        <path d="M 73 39 V 54 M 66 47 L 73 54 L 80 47" />
    </g>

    <!-- Blinking Typing Cursor -->
    <line class="cursor" x1="89" y1="39" x2="89" y2="54" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

    <!-- Skeleton text lines to represent the content of the markdown form -->
    <rect x="31" y="63" width="58" height="3" rx="1.5" fill="#ffffff" opacity="0.4" />
    <rect x="31" y="70" width="42" height="3" rx="1.5" fill="#ffffff" opacity="0.4" />

</svg>
